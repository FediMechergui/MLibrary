name: Refresh book catalogues
on:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 1"
permissions:
  contents: write
  actions: write
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run catalog:openiti
      - run: node scripts/seed-community.mjs
      - name: Validate catalogue before committing
        run: node --test tests/openiti.test.mjs tests/community.test.mjs
      - name: Save changed official metadata and run deployment checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- server/data/openiti.json.gz server/data/community.json.gz; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/data/openiti.json.gz server/data/community.json.gz
          git commit -m 'Refresh OpenITI and public publisher catalogues'
          git push origin HEAD:main
          gh workflow run checks.yml --ref main
